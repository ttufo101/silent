<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silent Shield · 图标与启动画面</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#17223b;font:15px/1.6 'Segoe UI','Microsoft YaHei',sans-serif}main{max-width:1180px;margin:auto;padding:48px 28px}h1{font-size:32px;letter-spacing:-1px;margin:8px 0}h2{font-size:21px;margin:0 0 8px}p{color:#68748b;margin:0 0 22px}.eyebrow{color:#1456df;font-weight:700;letter-spacing:3px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card{padding:28px;border-radius:24px;background:white;border:1px solid #e1e6ef}.hero{display:flex;align-items:center;gap:26px;margin:24px 0}.tag{display:inline-block;background:#eaf1ff;color:#1456df;padding:3px 12px;border-radius:20px;font-size:12px}.tile{width:128px;height:128px;border-radius:28%;background:#1456df;display:grid;place-items:center;flex-shrink:0}.tile svg{width:100%;height:100%}.row{display:flex;gap:24px;align-items:center;min-height:80px;flex-wrap:wrap}.sample{text-align:center;font-size:11px;color:#748097}.sample .tile{margin:auto auto 8px}.round{border-radius:50%}.squircle{border-radius:32%}.mono{background:#dbe4d5;color:#344c33}.mono svg{color:inherit}.sizes .tile{border-radius:24%}.dark{background:#182238;padding:18px;border-radius:16px;margin-top:14px}.dark .sample{color:#c0ccdf}.section{margin-top:28px}.phones{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.phone{position:relative;aspect-ratio:9/17;border:6px solid #263149;border-radius:28px;background:#f6f8fc;display:grid;place-items:center}.phone.night{background:#101828}.phone:before{content:'';position:absolute;top:9px;width:42px;height:9px;border-radius:10px;background:#263149}.phone:after{content:'';position:absolute;bottom:9px;width:32%;height:4px;border-radius:10px;background:#8190a6}.phone .tile{width:76px;height:76px;border-radius:50%}.label{text-align:center;color:#78859a;font-size:12px;margin:10px 0}.old{width:96px;height:96px}.comparison{display:flex;align-items:center;gap:28px;margin-top:22px}.foot{margin-top:28px;font-size:13px;color:#778298}@media(max-width:760px){.grid{grid-template-columns:1fr}main{padding:24px 16px}.hero{gap:16px}}
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="mark" viewBox="0 0 100 100"><path fill="currentColor" d="M50 16C42 23 34 27 25 30Q22 31 22 36V48C22 66 31 78 50 88C69 78 78 66 78 48V36Q78 31 75 30C66 27 58 23 50 16Z"/><path fill="#1456df" d="M65 36C58 32 45 32 38 38C30 45 33 53 44 58L52 62C62 67 52 76 36 70L34 73C45 80 61 77 66 68C71 59 64 54 53 49C40 43 47 36 64 39Z"/></symbol>
<symbol id="a" viewBox="0 0 100 100"><g color="white" transform="translate(12 8) scale(.76)"><use href="#mark"/></g></symbol>
<symbol id="b" viewBox="0 0 100 100"><g color="white" transform="translate(19 14) scale(.62)"><use href="#mark"/></g><path d="M22 34Q10 50 22 66M78 34Q90 50 78 66" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/></symbol>
</defs></svg>
<main><div class="eyebrow">SILENT SHIELD</div><h1>更清晰，也更容易认出</h1><p>桌面图标 · Android 自适应图标 · 启动画面</p>
<div class="grid" id="options"></div>
<div class="card section"><h2>现有图标</h2><div class="comparison"><img class="old" src="../../assets/images/icon.png" alt="现有图标"><img width="32" height="32" src="../../assets/images/icon.png" alt="现有图标32像素"><img width="16" height="16" src="../../assets/images/icon.png" alt="现有图标16像素"><p>完整波纹与光效在小尺寸中容易挤在一起。<br>新版优先让盾牌与 S 保持可辨识。</p></div></div>
<p class="foot">图标和启动画面为设计预览；真机中的图标大小与裁切由桌面启动器和系统决定。</p></main>
<script>
const tile=(id,size=128,extra='')=>`<div class="tile ${extra}" style="width:${size}px;height:${size}px"><svg viewBox="0 0 100 100" aria-label="Silent Shield 图标"><use href="#${id}"/></svg></div>`;
document.querySelector('#options').innerHTML=[['a','A · 简洁盾牌','推荐','集中呈现盾牌与 S，适合桌面小图标。'],['b','B · 保留波纹','品牌延续','保留一组波纹；小尺寸切换为简洁盾牌。']].map(([id,title,tag,desc])=>`<article class="card"><h2>${title}</h2><span class="tag">${tag}</span><div class="hero">${tile(id)}<p>${desc}</p></div><h2>桌面实际尺寸</h2><div class="row sizes">${[16,24,32,48].map(n=>`<div class="sample">${tile(n<=32?'a':id,n)}${n}px</div>`).join('')}</div><div class="row sizes dark">${[16,24,32,48].map(n=>`<div class="sample">${tile(n<=32?'a':id,n)}${n}px</div>`).join('')}</div><h2 class="section">Android 裁切</h2><div class="row">${[['round','圆形'],['squircle','圆角方形']].map(([cl,label])=>`<div class="sample">${tile(id,80,cl)}${label}</div>`).join('')}</div><h2 class="section">启动画面</h2><div class="phones"><div><div class="phone">${tile('a')}</div><div class="label">浅色</div></div><div><div class="phone night">${tile('a')}</div><div class="label">深色</div></div></div></article>`).join('');
</script>
</html>
